name: build-aibot-jar

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: ./gradlew --no-daemon --console=plain build -x test -x runGameTest

      - name: Show what was built
        run: ls -lh build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: aibot-jar
          path: build/libs/*.jar
          if-no-files-found: error
